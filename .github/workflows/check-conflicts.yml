name: Check PR Merge Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch PR branch
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch

      - name: Attempt merge
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git checkout pr-branch
          git merge origin/main --no-commit --no-ff || echo "CONFLICT" > conflict.txt

      - name: Check for conflicts
        run: |
          if [ -f conflict.txt ]; then
            echo "❌ Merge conflicts detected. Please resolve them before merging."
            exit 1
          else
            echo "✅ No merge conflicts. Safe to merge."
          fi
