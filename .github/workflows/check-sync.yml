name: Check Branch Sync with Main

on:
  pull_request:
    branches: [ main ]

jobs:
  check-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Compare branch with main
        run: |
          COMMITS_BEHIND=$(git rev-list --count HEAD..origin/main)
          if [ "$COMMITS_BEHIND" -ne 0 ]; then
            echo "❌ Your branch is behind main by $COMMITS_BEHIND commits."
            exit 1
          else
            echo "✅ Branch is up to date with main."
          fi
